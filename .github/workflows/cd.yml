name: CD - Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Cho phép trigger thủ công từ GitHub UI

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    environment: production # Tạo environment trong GitHub repository settings

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore SEP_SEOBoostAI.sln

    - name: Build solution
      run: dotnet build SEP_SEOBoostAI.sln --configuration Release --no-restore

    - name: Publish application
      run: dotnet publish SEOBoostAI.API/SEOBoostAI.API.csproj --configuration Release --output ./publish --no-build

